name: Release · Linux x64

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ env.TARGET }}
          source-sha: ${{ inputs.source-sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev desktop-file-utils squashfs-tools patchelf
      - name: Configure build
        env:
          WINC_UPDATE_PRIVATE_KEY: ${{ secrets.WINC_UPDATE_PRIVATE_KEY }}
        run: |
          node release/common/config.mjs --output "$RUNNER_TEMP/build-config.json"
      - name: Compile
        run: |
          cargo build --release --locked --target "$TARGET" -p winc-app -p winc-pty
          cargo xtask icons "target/$TARGET/release/bundle/icons"
      - name: Bundle and verify Arch package
        run: bash release/linux/arch/package.sh "$TARGET"
      - name: Prepare native packaging tools
        run: node release/linux/download-tools.mjs
      - name: Bundle deb and AppImage
        env:
          LINUXDEPLOY_DEBUG_LOG: ${{ runner.temp }}/linuxdeploy.log
          WINC_UPDATE_PRIVATE_KEY: ${{ secrets.WINC_UPDATE_PRIVATE_KEY }}
        run: |
          bash release/linux/package.sh "$TARGET"
          node release/common/sign-updates.mjs --platform linux-x64 --bundle "target/$TARGET/release/bundle"
          cargo test --locked -p winc-app updates::tests::release_appcast_matches_packages -- --ignored
      - name: Show linuxdeploy log
        if: always()
        run: cat "$RUNNER_TEMP/linuxdeploy.log" 2>/dev/null || echo "(no linuxdeploy log)"
      - name: Verify AppImage
        run: |
          shopt -s nullglob
          images=(target/"$TARGET"/release/bundle/appimage/*.AppImage)
          ((${#images[@]} == 1)) || { echo "::error::expected one AppImage"; exit 1; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          (cd "$workdir" && "$GITHUB_WORKSPACE/${images[0]}" --appimage-extract >/dev/null 2>&1)
          test -d "$workdir/squashfs-root/usr/lib"
          if find "$workdir/squashfs-root/usr/lib" -name 'libwayland*' -print -quit | grep -q .; then
            echo "::error::AppImage still bundles Wayland libraries"
            exit 1
          fi
      - name: Verify Debian package
        run: |
          dpkg-deb --info target/"$TARGET"/release/bundle/deb/*.deb
          dpkg-deb --contents target/"$TARGET"/release/bundle/deb/*.deb | tee "$RUNNER_TEMP/deb-contents"
          grep -q ./usr/bin/winc-pty "$RUNNER_TEMP/deb-contents"
          grep -q ./usr/bin/winc "$RUNNER_TEMP/deb-contents"
      - name: Stage release assets
        run: |
          node release/common/collect-assets.mjs --platform linux-x64 \
            --bundle "target/$TARGET/release/bundle" --out "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux-x64
          path: ${{ runner.temp }}/release-assets
          compression-level: 0
          if-no-files-found: error
          overwrite: true
