name: Release · macOS

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      arch:
        description: arm64 or x64
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      ARCH: ${{ inputs.arch }}
      TARGET: ${{ inputs.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate architecture
        run: '[[ "$ARCH" == arm64 || "$ARCH" == x64 ]]'
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ env.TARGET }}
          source-sha: ${{ inputs.source-sha }}
      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SIGN_AND_NOTARIZE_SCRIPT_URL: ${{ secrets.SIGN_AND_NOTARIZE_SCRIPT_URL }}
          SIGN_AND_NOTARIZE_BASE_URL: ${{ secrets.SIGN_AND_NOTARIZE_BASE_URL }}
          SIGN_AND_NOTARIZE_API_TOKEN: ${{ secrets.SIGN_AND_NOTARIZE_API_TOKEN }}
          SIGN_AND_NOTARIZE_HELPER_URL: ${{ secrets.SIGN_AND_NOTARIZE_HELPER_URL }}
        run: bash release/macos/configure-signing.sh
      - name: Configure build
        env:
          WINC_UPDATE_PRIVATE_KEY: ${{ secrets.WINC_UPDATE_PRIVATE_KEY }}
        run: |
          node release/common/config.mjs --output "$RUNNER_TEMP/build-config.json"
      - name: Compile
        run: |
          cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
          cargo xtask icons "target/$TARGET/release/bundle/icons"
      - name: Bundle app
        # The external provider receives an ad-hoc app; local Apple signing is
        # completed here before either final container is assembled.
        run: |
          bash release/macos/package.sh app "$TARGET"
      - name: Sign and notarize app (external service)
        if: env.SIGNING_MODE == 'external'
        timeout-minutes: 20
        env:
          SIGN_AND_NOTARIZE_SCRIPT_URL: ${{ secrets.SIGN_AND_NOTARIZE_SCRIPT_URL }}
          SIGN_AND_NOTARIZE_BASE_URL: ${{ secrets.SIGN_AND_NOTARIZE_BASE_URL }}
          SIGN_AND_NOTARIZE_API_TOKEN: ${{ secrets.SIGN_AND_NOTARIZE_API_TOKEN }}
          SIGN_AND_NOTARIZE_HELPER_URL: ${{ secrets.SIGN_AND_NOTARIZE_HELPER_URL }}
        run: bash release/macos/package.sh sign-app "$TARGET"
      - name: Create final DMG
        run: bash release/macos/package.sh dmg "$TARGET"
      - name: Sign and notarize DMG
        if: env.SIGNING_MODE != 'adhoc'
        timeout-minutes: 20
        env:
          SIGN_AND_NOTARIZE_SCRIPT_URL: ${{ secrets.SIGN_AND_NOTARIZE_SCRIPT_URL }}
          SIGN_AND_NOTARIZE_BASE_URL: ${{ secrets.SIGN_AND_NOTARIZE_BASE_URL }}
          SIGN_AND_NOTARIZE_API_TOKEN: ${{ secrets.SIGN_AND_NOTARIZE_API_TOKEN }}
          SIGN_AND_NOTARIZE_HELPER_URL: ${{ secrets.SIGN_AND_NOTARIZE_HELPER_URL }}
        run: bash release/macos/package.sh sign-dmg "$TARGET"
      - name: Sign the update feed
        env:
          WINC_UPDATE_PRIVATE_KEY: ${{ secrets.WINC_UPDATE_PRIVATE_KEY }}
        run: bash release/macos/package.sh appcast "$TARGET"
      - name: Verify DMG
        run: bash release/macos/package.sh verify "$TARGET"
      - name: Stage release assets
        run: |
          node release/common/collect-assets.mjs --platform "macos-$ARCH" \
            --bundle "target/$TARGET/release/bundle" --out "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-macos-${{ inputs.arch }}
          path: ${{ runner.temp }}/release-assets
          compression-level: 0
          if-no-files-found: error
          overwrite: true
