[package]
name = "winc-app"
description = "winc 桌面程序的实现：窗口、布局、圆润风格界面、输入处理。"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
winc-config.workspace = true
winc-core.workspace = true
winc-syntax.workspace = true
winc-render.workspace = true
winc-editor.workspace = true
winc-preview.workspace = true
winc-typeset.workspace = true
winc-pty.workspace = true
winc-i18n.workspace = true
winc-version.workspace = true
winit.workspace = true
ropey.workspace = true
arboard.workspace = true
unicode-segmentation.workspace = true

# 全局分配器（large_alloc.rs，仅 macOS）的 mmap、munmap，测量（bench.rs）的 getrusage。
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 打开、保存面板的完成回调是 Objective-C block。
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "objc2"] }

# 其他 Unix 平台：选择文件的面板通过 XDG 桌面门户（D-Bus），见 portal.rs。
# Wayland 上凭激活令牌把已有窗口切到前台（xdg-activation，见 wayland.rs），接入 winit 的
# Wayland 连接；这三个库和所需特性都已由 winit 引入，不增加依赖。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Wayland 会话：通过 data-control 协议（ext 或 wlr）直接读写 Wayland 剪贴板。不开时 arboard 只走
# XWayland 的 X11 剪贴板，而合成器只在 X11 窗口获得焦点时才把 Wayland 剪贴板同步过去，winc 是原生
# Wayland 窗口，读不到其他应用复制的内容。合成器没有该协议时 arboard 自动退回 X11。
arboard = { workspace = true, features = ["wayland-data-control"] }

# Windows：打开、另存为用系统的文件对话框（`IFileOpenDialog`、`IFileSaveDialog`，COM 接口）。
# 回收站（`SHFileOperationW`）、滚轮设置（`SystemParametersInfoW`）等系统接口；版本与 `rfd` 保持
# 一致，避免重复链接同一个库。
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Input_Pointer",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 其他平台上读剪贴板中的图片：arboard 把图片解码成 RGBA 像素，再由 winc-editor 编码为 PNG。
# macOS 上直接取系统剪贴板中的 PNG（TIFF 由系统转换），不开该项，不带进图片编解码库。
# 应用内更新（以 AppImage 运行或由安装包安装时，见 updates.rs）：核对更新包的 Ed25519 签名（与
# macOS 的 Sparkle 同一把密钥），读 appcast。网络请求交给系统的 curl、wget，不带 TLS 实现。
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { workspace = true, features = ["image-data"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
roxmltree.workspace = true

[lints]
workspace = true
